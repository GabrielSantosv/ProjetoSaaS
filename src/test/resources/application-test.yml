spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

security:
  jwt:
    secret-key: 8f4c2e9b1a7d5f3c6e0b4a8d2f5e7a9c1b3d5e7f9a2b4c6e8d0f1a3b5c7e9d2f
    expiration-ms: 3600000
