server:
  port: 8080

spring:
  application:
    name: saas-gestao-comercio

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # Java 21 Virtual Threads ativadas para o Tomcat e tarefas assíncronas do Spring
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/saas_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
    username: ${SPRING_DATASOURCE_USERNAME:saas_user}
    password: ${SPRING_DATASOURCE_PASSWORD:saas_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Justificativa técnica do dimensionamento do Pool HikariCP:
      # - O módulo de importação massiva paralela (Virtual Threads) pode executar entre 5 a 10 workers concorrentes.
      # - O tráfego simultâneo da API (pedidos, catálogo, PDV, relatórios) consome conexões em paralelo.
      # - maximum-pool-size: 25 garante vazão para o paralelismo de importação sem causar starvation no tráfego HTTP.
      # - rewriteBatchedStatements=true na URL otimiza o batchUpdate do JdbcTemplate transformando em single-roundtrip multi-row INSERT.
      maximum-pool-size: 25
      minimum-idle: 10
      idle-timeout: 30000
      pool-name: SaasHikariPool
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Configurações de Segurança e JWT
# ATENÇÃO: Em produção/homologação, a chave DEVE ser fornecida via variável de ambiente JWT_SECRET
security:
  jwt:
    secret-key: ${JWT_SECRET:8f4c2e9b1a7d5f3c6e0b4a8d2f5e7a9c1b3d5e7f9a2b4c6e8d0f1a3b5c7e9d2f}
    expiration-ms: 86400000 # 24 horas

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

resilience4j:
  retry:
    instances:
      importBatchRetry:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.DeadlockLoserDataAccessException
          - org.springframework.dao.CannotAcquireLockException
          - org.springframework.dao.TransientDataAccessException
          - java.sql.SQLTransientException
          - java.sql.SQLTimeoutException
